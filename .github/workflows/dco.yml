name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Signed-off commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify DCO sign-offs
        run: .github/scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
